services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dezzly-creative:latest
    container_name: dezzly_creative_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://192.168.18.15:8000
      - ASSET_URL=
    networks:
      - dezzly_net

networks:
  dezzly_net:
    driver: bridge
