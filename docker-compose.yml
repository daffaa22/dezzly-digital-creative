services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dezzly-creative:latest
    container_name: dezzly_creative_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    networks:
      - dezzly_net

networks:
  dezzly_net:
    driver: bridge
