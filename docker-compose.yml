services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dezzly-creative:latest
    container_name: dezzly_creative_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
    networks:
      - dezzly_net

networks:
  dezzly_net:
    driver: bridge

